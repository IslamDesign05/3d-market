<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — 3D Print Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #7b2cbf; --accent: #ffca3a; --bg: #0f0f1a; --card: #1a1a2e; --text: #e8e8f0; --muted: #a0a0b8; --danger: #e74c3c; --success: #2ecc71; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); font-family: 'Inter', system-ui, sans-serif; color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    .nav { display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 2rem; background: rgba(15,15,26,0.95); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(123,44,191,0.3); }
    .logo { font-size: 1.5rem; font-weight: 800; color: var(--accent); text-decoration: none; }
    .logo span { color: var(--primary); }
    .btn { padding: 0.7rem 1.6rem; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; font-family: inherit; text-decoration: none; display: inline-block; text-align: center; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: #9b4fd9; transform: translateY(-2px); }
    .btn-outline { background: transparent; color: var(--muted); border: 1px solid rgba(255,255,255,0.1); }
    
    .auth-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .auth-card { background: var(--card); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 440px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .auth-card h1 { font-size: 1.6rem; margin-bottom: 0.3rem; text-align: center; }
    .auth-card p.sub { color: var(--muted); text-align: center; margin-bottom: 1.8rem; font-size: 0.9rem; }
    .form-group { margin-bottom: 1.1rem; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.4rem; font-weight: 500; }
    .form-group input { width: 100%; padding: 0.85rem 1rem; background: var(--bg); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; color: var(--text); font-size: 0.95rem; font-family: inherit; outline: none; transition: all 0.2s; }
    .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(123,44,191,0.15); }
    .btn-submit { width: 100%; padding: 0.9rem; margin-top: 0.5rem; }
    .auth-footer { text-align: center; margin-top: 1.5rem; color: var(--muted); font-size: 0.9rem; }
    .auth-footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .error-msg { background: rgba(231,76,60,0.1); border: 1px solid rgba(231,76,60,0.3); color: var(--danger); padding: 0.8rem; border-radius: 10px; margin-bottom: 1rem; font-size: 0.85rem; display: none; }
    @media (max-width: 640px) { .auth-card { padding: 1.5rem; } }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="logo">3D<span>Print</span>Studio</a>
    <a href="index.html" class="btn btn-outline">← На главную</a>
  </nav>

  <div class="auth-container">
    <div class="auth-card">
      <h1>🚀 Создать аккаунт</h1>
      <p class="sub">Быстрая регистрация за 30 секунд</p>

      <div class="error-msg" id="errorBox"></div>

      <div class="form-group">
        <label>Имя</label>
        <input type="text" id="name" placeholder="Иван">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Телефон</label>
        <input type="tel" id="phone" placeholder="+7 (999) 123-45-67">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="password" placeholder="Минимум 6 символов">
      </div>

      <button class="btn btn-primary btn-submit" onclick="handleRegister()">Зарегистрироваться</button>

      <div class="auth-footer">
        Уже есть аккаунт? <a href="login.html">Войти</a>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    function handleRegister() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const err = document.getElementById('errorBox');

      if (!name || !email || !phone || !password) { err.textContent = 'Заполните все поля'; err.style.display = 'block'; return; }
      if (password.length < 6) { err.textContent = 'Пароль должен быть не менее 6 символов'; err.style.display = 'block'; return; }

      const res = AUTH.register(name, email, phone, password);
      if (!res.ok) { err.textContent = res.error; err.style.display = 'block'; return; }

      window.location.href = 'profile.html';
    }
    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleRegister(); });
  </script>
</body>
</html>
