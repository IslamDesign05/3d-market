<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Загрузка 3D-модели — PolyPrint 3D</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #7b2cbf;
      --accent: #ffca3a;
      --bg: #0f0f1a;
      --card: #1a1a2e;
      --card-hover: #252540;
      --text: #e8e8f0;
      --muted: #a0a0b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); font-family: 'Inter', system-ui, sans-serif;
      color: var(--text); line-height: 1.5; min-height: 100vh;
    }
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 2rem; background: rgba(15,15,26,0.85);
      backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid rgba(123,44,191,0.2);
    }
    .logo { font-size: 1.5rem; font-weight: 800; color: var(--accent); letter-spacing: -0.5px; text-decoration: none; }
    .logo span { color: var(--primary); }
    .btn {
      padding: 0.6rem 1.4rem; border-radius: 10px; border: none; cursor: pointer;
      font-weight: 600; font-size: 0.95rem; transition: all 0.2s; font-family: inherit; text-decoration: none; display: inline-block;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: #9b4fd9; transform: translateY(-2px); }
    .btn-accent { background: var(--accent); color: #1a1a2e; }
    .btn-accent:hover { background: #ffe082; transform: translateY(-2px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

    .container { max-width: 720px; margin: 0 auto; padding: 3rem 2rem; }
    .page-title { font-size: 2rem; font-weight: 800; text-align: center; margin-bottom: 0.5rem; }
    .page-sub { color: var(--muted); text-align: center; margin-bottom: 2.5rem; }

    .dropzone {
      border: 2px dashed rgba(123,44,191,0.4); border-radius: 20px;
      padding: 3rem 2rem; text-align: center; background: var(--card);
      transition: all 0.3s; cursor: pointer; position: relative;
    }
    .dropzone:hover, .dropzone.dragover {
      border-color: var(--accent); background: rgba(123,44,191,0.08);
      box-shadow: 0 0 40px rgba(123,44,191,0.1);
    }
    .dropzone-icon { font-size: 3rem; margin-bottom: 1rem; }
    .dropzone h3 { font-size: 1.2rem; margin-bottom: 0.5rem; }
    .dropzone p { color: var(--muted); font-size: 0.9rem; }
    .dropzone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .formats {
      display: flex; gap: 0.5rem; justify-content: center; margin-top: 1rem;
    }
    .format-chip {
      padding: 0.3rem 0.8rem; border-radius: 8px; font-size: 0.8rem; font-weight: 600;
      background: rgba(255,202,58,0.1); color: var(--accent); border: 1px solid rgba(255,202,58,0.2);
    }

    .file-info {
      background: var(--card); border-radius: 16px; padding: 1.5rem;
      margin-top: 1.5rem; border: 1px solid rgba(255,255,255,0.05);
      animation: slideUp 0.4s ease;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .file-info h4 { color: var(--accent); margin-bottom: 1rem; font-size: 1rem; }
    .info-row { display: flex; justify-content: space-between; padding: 0.6rem 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: var(--muted); font-size: 0.9rem; }
    .info-value { font-weight: 700; font-size: 0.95rem; }

    .actions { display: flex; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap; }
    .spinner {
      display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.2);
      border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;
      margin-right: 0.5rem; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error {
      background: rgba(231,76,60,0.1); border: 1px solid rgba(231,76,60,0.3);
      color: #e74c3c; padding: 1rem; border-radius: 12px; margin-top: 1rem; font-size: 0.9rem;
    }

    @media (max-width: 640px) {
      .page-title { font-size: 1.6rem; }
      .dropzone { padding: 2rem 1rem; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="logo">Poly<span>Print</span> 3D</a>
    <a href="index.html" class="btn btn-primary">← На главную</a>
  </nav>

  <div class="container">
    <h1 class="page-title">Расчёт стоимости печати</h1>
    <p class="page-sub">Загрузите 3D-модель в формате STL или OBJ. Мы проанализируем геометрию и рассчитаем точную цену.</p>

    <div class="dropzone" id="dropzone">
      <input type="file" id="fileInput" accept=".stl,.obj">
      <div class="dropzone-icon">📁</div>
      <h3>Перетащите файл сюда</h3>
      <p>или нажмите, чтобы выбрать на устройстве</p>
      <div class="formats">
        <span class="format-chip">.STL</span>
        <span class="format-chip">.OBJ</span>
      </div>
    </div>

    <div id="errorBox"></div>
    <div id="fileInfo"></div>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const errorBox = document.getElementById('errorBox');
    const fileInfo = document.getElementById('fileInfo');

    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault(); dropzone.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => { if (e.target.files.length) handleFile(e.target.files[0]); });

    function showError(msg) {
      errorBox.innerHTML = `<div class="error">⚠️ ${msg}</div>`;
      fileInfo.innerHTML = '';
    }
    function clearError() { errorBox.innerHTML = ''; }

    function handleFile(file) {
      clearError();
      const name = file.name.toLowerCase();
      if (!name.endsWith('.stl') && !name.endsWith('.obj')) {
        showError('Поддерживаются только файлы .STL и .OBJ'); return;
      }
      if (file.size > 50 * 1024 * 1024) {
        showError('Файл слишком большой (макс. 50 МБ)'); return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const result = name.endsWith('.stl') ? parseSTL(e.target.result) : parseOBJ(e.target.result);
          if (!result || result.volume <= 0) throw new Error('Не удалось определить объём модели');
          showFileInfo(file.name, result);
        } catch (err) {
          showError('Ошибка чтения файла: ' + err.message);
        }
      };
      if (name.endsWith('.stl')) reader.readAsArrayBuffer(file);
      else reader.readAsText(file);
    }

    function parseSTL(buffer) {
      const arr = new Uint8Array(buffer);
      const isBinary = !((arr[0]===115 && arr[1]===111 && arr[2]===108) || (arr[0]===83 && arr[1]===79 && arr[2]===76));
      if (isBinary) return parseBinarySTL(buffer);
      return parseTextSTL(new TextDecoder().decode(buffer));
    }

    function parseBinarySTL(buffer) {
      const view = new DataView(buffer);
      const num = view.getUint32(80, true);
      let volume = 0, area = 0;
      let offset = 84;
      for (let i = 0; i < num; i++) {
        const v0 = [view.getFloat32(offset+12,true), view.getFloat32(offset+16,true), view.getFloat32(offset+20,true)];
        const v1 = [view.getFloat32(offset+24,true), view.getFloat32(offset+28,true), view.getFloat32(offset+32,true)];
        const v2 = [view.getFloat32(offset+36,true), view.getFloat32(offset+40,true), view.getFloat32(offset+44,true)];
        volume += tetrahedronVolume(v0, v1, v2);
        area += triangleArea(v0, v1, v2);
        offset += 50;
      }
      return { volume: Math.abs(volume), area, count: num };
    }

    function parseTextSTL(text) {
      const verts = [];
      const lines = text.split(/\r?\n/);
      for (const line of lines) {
        const t = line.trim();
        if (t.startsWith('vertex ')) {
          const p = t.split(/\s+/);
          verts.push([parseFloat(p[1]), parseFloat(p[2]), parseFloat(p[3])]);
        }
      }
      let volume = 0, area = 0;
      for (let i = 0; i < verts.length; i += 3) {
        if (i+2 >= verts.length) break;
        volume += tetrahedronVolume(verts[i], verts[i+1], verts[i+2]);
        area += triangleArea(verts[i], verts[i+1], verts[i+2]);
      }
      return { volume: Math.abs(volume), area, count: verts.length/3 };
    }

    function parseOBJ(text) {
      const verts = [];
      const faces = [];
      for (const line of text.split(/\r?\n/)) {
        const t = line.trim();
        if (t.startsWith('v ')) {
          const p = t.split(/\s+/);
          verts.push([parseFloat(p[1]), parseFloat(p[2]), parseFloat(p[3])]);
        } else if (t.startsWith('f ')) {
          const idx = t.split(/\s+/).slice(1).map(s => parseInt(s.split('/')[0]) - 1);
          faces.push(idx);
        }
      }
      let volume = 0, area = 0, triCount = 0;
      for (const face of faces) {
        for (let i = 1; i < face.length - 1; i++) {
          const v0 = verts[face[0]], v1 = verts[face[i]], v2 = verts[face[i+1]];
          if (!v0 || !v1 || !v2) continue;
          volume += tetrahedronVolume(v0, v1, v2);
          area += triangleArea(v0, v1, v2);
          triCount++;
        }
      }
      return { volume: Math.abs(volume), area, count: triCount || faces.length };
    }

    function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
    function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
    function sub(a,b){return[a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
    function triangleArea(v0,v1,v2){
      const c=cross(sub(v1,v0),sub(v2,v0));
      return Math.sqrt(c[0]*c[0]+c[1]*c[1]+c[2]*c[2])*0.5;
    }
    function tetrahedronVolume(v0,v1,v2){
      return Math.abs(dot(v0,cross(v1,v2)))/6.0;
    }

    function showFileInfo(name, data) {
      localStorage.setItem('pp3d_file', JSON.stringify({
        name, volume: data.volume, area: data.area, count: data.count
      }));
      fileInfo.innerHTML = `
        <div class="file-info">
          <h4>📊 Анализ модели: ${name}</h4>
          <div class="info-row"><span class="info-label">Объём модели</span><span class="info-value">${(data.volume/1000).toFixed(2)} см³</span></div>
          <div class="info-row"><span class="info-label">Площадь поверхности</span><span class="info-value">${(data.area/100).toFixed(2)} см²</span></div>
          <div class="info-row"><span class="info-label">Треугольников / граней</span><span class="info-value">${data.count.toLocaleString('ru')}</span></div>
          <div class="actions">
            <a href="calculator.html" class="btn btn-accent" style="font-size:1rem;padding:0.8rem 2rem;">🧮 Рассчитать стоимость</a>
            <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">🔄 Загрузить другой файл</button>
          </div>
        </div>
      `;
    }
  </script>

</body>
</html>
