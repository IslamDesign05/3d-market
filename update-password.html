<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новый пароль — 3D Print Studio</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="auth-container">
    <section class="auth-card" style="max-width:480px;margin:8vh auto;padding:32px">
      <h1>Создать новый пароль</h1>
      <p class="sub">Введите новый пароль для своего аккаунта.</p>
      <div class="error-msg" id="message" role="status"></div>
      <div class="form-group">
        <label for="newPassword">Новый пароль</label>
        <input id="newPassword" type="password" minlength="6" autocomplete="new-password" required>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Повторите пароль</label>
        <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required>
      </div>
      <button class="btn btn-primary btn-submit" id="savePassword" type="button">Сохранить новый пароль</button>
      <p><a href="login.html">Вернуться ко входу</a></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    const message = document.getElementById('message');
    document.getElementById('savePassword').addEventListener('click', async () => {
      const password = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      message.style.display = 'block';
      if (password.length < 6) { message.textContent = 'Пароль должен содержать не менее 6 символов.'; return; }
      if (password !== confirm) { message.textContent = 'Пароли не совпадают.'; return; }
      const result = await AUTH.updatePassword(password);
      if (!result.ok) { message.textContent = result.error; return; }
      message.textContent = 'Пароль успешно изменён. Теперь можно войти с новым паролем.';
      document.getElementById('savePassword').disabled = true;
    });
  </script>
</body>
</html>
