<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет — 3D Print Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #7b2cbf; --accent: #ffca3a; --bg: #0f0f1a; --card: #1a1a2e; --text: #e8e8f0; --muted: #a0a0b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); font-family: 'Inter', system-ui, sans-serif; color: var(--text); }
    .nav { display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 2rem; background: rgba(15,15,26,0.95); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(123,44,191,0.3); }
    .logo { font-size: 1.5rem; font-weight: 800; color: var(--accent); text-decoration: none; }
    .logo span { color: var(--primary); }
    .btn { padding: 0.6rem 1.4rem; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; font-family: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: #9b4fd9; }
    .btn-outline { background: transparent; color: var(--muted); border: 1px solid rgba(255,255,255,0.1); }
    
    .container { max-width: 960px; margin: 0 auto; padding: 2.5rem 2rem; }
    .page-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 1.5rem; }
    
    .profile-grid { display: grid; grid-template-columns: 280px 1fr; gap: 2rem; }
    @media (max-width: 800px) { .profile-grid { grid-template-columns: 1fr; } }

    .profile-card { background: var(--card); border-radius: 16px; padding: 1.8rem; border: 1px solid rgba(255,255,255,0.05); text-align: center; }
    .avatar { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--accent)); display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 1rem; }
    .profile-name { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.2rem; }
    .profile-email { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.2rem; }
    
    .stat-row { display: flex; justify-content: space-between; padding: 0.6rem 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { color: var(--muted); }
    .stat-value { font-weight: 700; color: var(--accent); }

    .panel { background: var(--card); border-radius: 16px; padding: 1.5rem; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 1.5rem; }
    .panel h3 { font-size: 1.1rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }

    .order-item { display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: rgba(255,255,255,0.02); border-radius: 10px; margin-bottom: 0.6rem; border: 1px solid rgba(255,255,255,0.03); }
    .order-id { font-weight: 700; font-size: 0.9rem; }
    .order-date { color: var(--muted); font-size: 0.8rem; }
    .order-sum { font-weight: 800; color: var(--accent); }
    .empty-orders { text-align: center; padding: 2rem; color: var(--muted); }

    .footer { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.9rem; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 2rem; }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="logo">3D<span>Print</span>Studio</a>
    <div style="display:flex;align-items:center;gap:0.6rem;" id="navAuth">
      <!-- Заполняется auth.js -->
    </div>
  </nav>

  <div class="container">
    <h1 class="page-title">Личный кабинет</h1>
    
    <div class="profile-grid">
      <!-- Левая колонка -->
      <div>
        <div class="profile-card">
          <div class="avatar">👤</div>
          <div class="profile-name" id="pName">Загрузка...</div>
          <div class="profile-email" id="pEmail">...</div>
          <div style="margin-top:1rem;">
            <a href="cart.html" class="btn btn-primary" style="width:100%;margin-bottom:0.5rem;">🛒 Перейти в корзину</a>
            <button class="btn btn-outline" style="width:100%;" onclick="AUTH.logout()">Выйти из аккаунта</button>
          </div>
        </div>
      </div>

      <!-- Правая колонка -->
      <div>
        <div class="panel">
          <h3>📋 Информация</h3>
          <div class="stat-row"><span class="stat-label">Телефон</span><span class="stat-value" id="pPhone">—</span></div>
          <div class="stat-row"><span class="stat-label">Дата регистрации</span><span class="stat-value" id="pDate">—</span></div>
          <div class="stat-row"><span class="stat-label">Всего заказов</span><span class="stat-value" id="pOrdersCount">0</span></div>
        </div>

        <div class="panel">
          <h3>📦 История заказов</h3>
          <div id="ordersList">
            <div class="empty-orders">Пока нет заказов</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">© 2026 3D Print Studio. Все права защищены.</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    // Защита: если не авторизован — на вход
    if (!AUTH.isLoggedIn()) {
      window.location.href = 'login.html';
    }

    const user = AUTH.currentUser();
    if (user) {
      document.getElementById('pName').textContent = user.name;
      document.getElementById('pEmail').textContent = user.email;
      document.getElementById('pPhone').textContent = user.phone;
      document.getElementById('pDate').textContent = new Date(user.createdAt).toLocaleDateString('ru-RU');
      document.getElementById('pOrdersCount').textContent = (user.orders || []).length;

      const list = document.getElementById('ordersList');
      if (user.orders && user.orders.length > 0) {
        list.innerHTML = user.orders.map(o => `
          <div class="order-item">
            <div>
              <div class="order-id">Заказ ${o.id.slice(-6)}</div>
              <div class="order-date">${o.date}</div>
            </div>
            <div class="order-sum">${o.total || '—'} ₽</div>
          </div>
        `).join('');
      }
    }
  </script>
</body>
</html>
